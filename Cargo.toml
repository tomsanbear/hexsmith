[package]
name = "hexsmith"
version = "0.0.0"
edition = "2024"
description = "A reserved crate name for the forthcoming hexsmith library."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tomsanbear/hexsmith"
readme = "README.md"
keywords = ["hex", "encoding"]
categories = ["encoding"]

[dependencies]

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unfulfilled_lint_expectations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "allow"
too_many_lines = "allow"
